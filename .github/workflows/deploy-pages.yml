name: Final QA and Deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          set -e
          for file in *.js; do
            node --check "$file"
          done
          for file in tools/*.mjs; do
            [ -e "$file" ] || continue
            node --check "$file"
          done

      - name: Check required runtime files
        run: |
          set -e
          for file in index.html styles.css features.css ui-fix.css records-enhancements.css app.js reference.js book-finder.js testament-select.js compare.js verse-picker.js clipboard.js title-nav.js exact-search.js locale-safe.js verse-tools.js records-enhancements.js; do
            test -s "$file"
          done

      - name: Check deferred annotation runtime is excluded
        run: |
          ! grep -q 'annotations-data.js' index.html
          ! grep -q 'annotations.js' index.html

      - name: Check retired runtime is excluded
        run: |
          ! grep -q 'src="locale.js"' index.html
          ! grep -q 'src="daily.js"' index.html
          ! grep -q 'src="focus-mode.js"' index.html
          ! grep -q 'notebook-tabs-fix.css' index.html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: qa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
