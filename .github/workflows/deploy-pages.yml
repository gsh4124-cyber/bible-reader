name: Final QA and Deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          set -e
          for file in *.js; do
            node --check "$file"
          done
          for file in tools/*.mjs; do
            [ -e "$file" ] || continue
            node --check "$file"
          done

      - name: Validate multilingual integrity
        run: node tools/validate-i18n.mjs

      - name: Check required runtime files
        run: |
          set -e
          for file in index.html styles.css features.css ui-fix.css i18n-layout.css records-enhancements.css app.js extra-translations.js local-file-language.js i18n.js runtime-ui-i18n.js ui-language-sync.js full-reader-loader.js reference.js book-finder.js compare.js verse-picker.js clipboard.js title-nav.js exact-search.js verse-tools.js records-enhancements.js analytics.js robots.txt sitemap.xml 193977ee04feba4a99f471a555a2aa54.txt; do
            test -s "$file"
          done
          for lang in en fr de zh ru la pt ar; do
            test -s "$lang/index.html"
          done

      - name: Check multilingual SEO entry points
        run: |
          set -e
          for lang in en fr de zh ru la pt ar; do
            grep -q "hreflang=\"$lang\"" "$lang/index.html"
            grep -q "rel=\"canonical\"" "$lang/index.html"
            grep -q 'name="description"' "$lang/index.html"
            grep -q "bible-reader/$lang/" sitemap.xml
          done
          grep -q 'hreflang="x-default"' index.html
          grep -q 'src="local-file-language.js"' index.html
          grep -q 'src="i18n.js"' index.html
          grep -q 'src="runtime-ui-i18n.js"' index.html
          grep -q 'src="ui-language-sync.js"' index.html
          grep -q '^Sitemap: https://gsh4124-cyber.github.io/bible-reader/sitemap.xml$' robots.txt
          test "$(tr -d '\r\n' < 193977ee04feba4a99f471a555a2aa54.txt)" = "193977ee04feba4a99f471a555a2aa54"

      - name: Check deferred annotation runtime is excluded
        run: |
          ! grep -q 'annotations-data.js' index.html
          ! grep -q 'annotations.js' index.html

      - name: Check retired runtime is excluded
        run: |
          ! grep -q 'src="locale.js"' index.html
          ! grep -q 'src="locale-safe.js"' index.html
          ! grep -q 'src="language-selector.js"' index.html
          ! grep -q 'src="launch-translation.js"' index.html
          ! grep -q 'src="testament-select.js"' index.html
          ! grep -q 'src="daily.js"' index.html
          ! grep -q 'src="focus-mode.js"' index.html
          ! grep -q 'notebook-tabs-fix.css' index.html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: qa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-indexnow:
    name: notify-indexnow
    runs-on: ubuntu-latest
    needs: deploy
    continue-on-error: true
    steps:
      - name: Checkout recent history
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Notify IndexNow of localized entry URLs when web content changed
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request

          if os.environ.get("GITHUB_EVENT_NAME") == "push":
              changed = subprocess.check_output(["git", "diff", "--name-only", "HEAD^", "HEAD"], text=True).splitlines()
              relevant = [path for path in changed if not path.endswith(".md") and not path.startswith(".github/")]
              if not relevant:
                  print("IndexNow skipped: documentation/workflow-only change")
                  raise SystemExit(0)
              print("IndexNow relevant changes:", ", ".join(relevant))

          key = "193977ee04feba4a99f471a555a2aa54"
          base = "https://gsh4124-cyber.github.io/bible-reader/"
          urls = [base] + [base + lang + "/" for lang in ["en","fr","de","zh","ru","la","pt","ar"]]
          payload = {
              "host": "gsh4124-cyber.github.io",
              "key": key,
              "keyLocation": base + key + ".txt",
              "urlList": urls,
          }
          request = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              code = response.getcode()
              print(f"IndexNow response: {code}; submitted {len(urls)} URLs")
              if code not in (200, 202):
                  raise SystemExit(f"Unexpected IndexNow status: {code}")
          PY
