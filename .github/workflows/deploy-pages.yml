name: Final QA and Deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          set -e
          for file in *.js; do
            node --check "$file"
          done
          for file in tools/*.mjs; do
            [ -e "$file" ] || continue
            node --check "$file"
          done

      - name: Validate multilingual integrity
        run: node tools/validate-i18n.mjs

      - name: Check required runtime files
        run: |
          set -e
          for file in index.html styles.css features.css ui-fix.css i18n-layout.css records-enhancements.css app.js extra-translations.js i18n.js runtime-ui-i18n.js full-reader-loader.js reference.js book-finder.js testament-select.js compare.js verse-picker.js clipboard.js title-nav.js exact-search.js verse-tools.js records-enhancements.js analytics.js; do
            test -s "$file"
          done
          for lang in en fr de zh ru la pt ar; do
            test -s "$lang/index.html"
          done

      - name: Check multilingual SEO entry points
        run: |
          set -e
          for lang in en fr de zh ru la pt ar; do
            grep -q "hreflang=\"$lang\"" "$lang/index.html"
            grep -q "rel=\"canonical\"" "$lang/index.html"
            grep -q 'name="description"' "$lang/index.html"
            grep -q "bible-reader/$lang/" sitemap.xml
          done
          grep -q 'hreflang="x-default"' index.html
          grep -q 'src="i18n.js"' index.html
          grep -q 'src="runtime-ui-i18n.js"' index.html

      - name: Check deferred annotation runtime is excluded
        run: |
          ! grep -q 'annotations-data.js' index.html
          ! grep -q 'annotations.js' index.html

      - name: Check retired runtime is excluded
        run: |
          ! grep -q 'src="locale.js"' index.html
          ! grep -q 'src="locale-safe.js"' index.html
          ! grep -q 'src="language-selector.js"' index.html
          ! grep -q 'src="launch-translation.js"' index.html
          ! grep -q 'src="daily.js"' index.html
          ! grep -q 'src="focus-mode.js"' index.html
          ! grep -q 'notebook-tabs-fix.css' index.html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: qa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
