<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>성경 읽기</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="features.css" />
</head>
<body>
  <header class="topbar">
    <div class="location-controls" aria-label="성경 위치 선택">
      <div class="testament-tabs" role="group" aria-label="구약 신약 분류">
        <button type="button" class="testament-button active" data-testament="all" aria-pressed="true">전체</button>
        <button type="button" class="testament-button" data-testament="old" aria-pressed="false">구약</button>
        <button type="button" class="testament-button" data-testament="new" aria-pressed="false">신약</button>
      </div>
      <div class="selectors">
        <input id="bookFinder" class="book-finder" list="bookList" autocomplete="off" placeholder="책 이름" aria-label="성경책 빠른 찾기" />
        <datalist id="bookList"></datalist>
        <select id="bookSelect" aria-label="성경책"></select>
        <select id="chapterSelect" aria-label="장"></select>
      </div>
      <div class="chapter-arrows" aria-label="장 이동">
        <button id="prevChapter" class="icon-button" title="이전 장 (←)">←</button>
        <button id="nextChapter" class="icon-button" title="다음 장 (→)">→</button>
      </div>
    </div>

    <div class="toolbar" aria-label="읽기 도구">
      <button id="compareToggle" class="text-button primary-tool" type="button" aria-pressed="false" title="두 역본 나란히 비교">비교</button>
      <span class="toolbar-divider" aria-hidden="true"></span>
      <button id="fontDown" class="text-button subtle-tool" title="글자 작게">가−</button>
      <button id="fontUp" class="text-button subtle-tool" title="글자 크게">가+</button>
      <button id="widthToggle" class="text-button subtle-tool" title="본문 폭 변경">폭</button>
      <button id="themeToggle" class="icon-button subtle-tool" title="밝기 전환">◐</button>
    </div>
  </header>

  <main>
    <section class="reader-shell">
      <section class="daily-strip" aria-label="오늘의 말씀">
        <button id="dailyVerseCard" class="daily-card daily-verse-card" type="button">
          <span class="daily-kicker">오늘의 성구</span>
          <strong id="dailyVerseRef">말씀을 준비하는 중…</strong>
          <span id="dailyVerseText" class="daily-text"></span>
          <span class="daily-action">본문에서 보기 →</span>
        </button>
        <button id="dailyChapterCard" class="daily-card daily-chapter-card" type="button">
          <span class="daily-kicker">오늘 읽어볼 장</span>
          <strong id="dailyChapterRef">오늘의 장을 준비하는 중…</strong>
          <span class="daily-text">짧게라도 한 장을 천천히 읽어보세요.</span>
          <span class="daily-action">이 장 읽기 →</span>
        </button>
      </section>

      <aside class="ad-slot ad-slot-top" data-ad-slot="top" aria-label="광고 영역"><span>광고</span></aside>

      <form id="searchForm" class="search-box" role="search">
        <input id="searchInput" type="search" autocomplete="off" placeholder="단어 검색 또는 요 3:16 · 롬 8:28 입력" aria-label="성경 검색 또는 구절 바로가기" />
        <button id="searchButton" type="submit">검색</button>
      </form>
      <section id="searchPanel" class="search-panel" hidden aria-label="검색 결과">
        <div class="search-panel-head"><p id="searchSummary" class="search-summary"></p><button id="closeSearch" type="button" class="search-close">닫기</button></div>
        <div id="searchResults" class="search-results"></div>
      </section>

      <div class="chapter-heading"><p class="translation-label">개역한글</p><h1 id="chapterTitle">요한복음 3장</h1></div>

      <section id="comparePanel" class="compare-panel" hidden aria-label="역본 비교">
        <div class="compare-controls" aria-label="비교 역본 선택">
          <label><span>왼쪽 역본</span><select id="leftTranslation" aria-label="왼쪽 비교 역본"><option value="krv1961">개역한글</option><option value="kjv">King James Version</option></select></label>
          <button id="swapTranslations" type="button" class="swap-button" title="좌우 역본 바꾸기">⇄</button>
          <label><span>오른쪽 역본</span><select id="rightTranslation" aria-label="오른쪽 비교 역본"><option value="kjv">King James Version</option><option value="krv1961">개역한글</option></select></label>
        </div>
        <div class="compare-head"><div><strong id="leftTranslationName">개역한글</strong><span id="leftTranslationMeta">한국어</span></div><div><strong id="rightTranslationName">King James Version</strong><span id="rightTranslationMeta">영어 · Public Domain</span></div></div>
        <div id="compareStatus" class="compare-status"></div><div id="compareRows" class="compare-rows"></div>
      </section>

      <div id="singleReader"><div id="status" class="status">본문을 불러오는 중…</div><article id="verses" class="verses" aria-live="polite"></article></div>

      <nav class="chapter-nav" aria-label="장 이동"><button id="prevChapterBottom">← 이전 장</button><button id="nextChapterBottom">다음 장 →</button></nav>
      <aside class="ad-slot ad-slot-bottom" data-ad-slot="bottom" aria-label="광고 영역"><span>광고</span></aside>
    </section>
  </main>

  <footer><p>성경전서 개역한글판 · 대한성서공회</p><p class="source-note">비교 가능 역본: 개역한글 · King James Version(Public Domain). 권리 확인이 끝난 역본부터 선택 목록에 추가합니다.</p></footer>

  <script src="app.js" defer></script><script src="reference.js" defer></script><script src="book-finder.js" defer></script><script src="daily.js" defer></script><script src="compare.js" defer></script>
</body>
</html>
