<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>성경 읽기</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">성경</div>

    <div class="location-controls" aria-label="성경 위치 선택">
      <div class="testament-tabs" role="group" aria-label="구약 신약 분류">
        <button type="button" class="testament-button active" data-testament="all" aria-pressed="true">전체</button>
        <button type="button" class="testament-button" data-testament="old" aria-pressed="false">구약</button>
        <button type="button" class="testament-button" data-testament="new" aria-pressed="false">신약</button>
      </div>
      <div class="selectors">
        <select id="bookSelect" aria-label="성경책"></select>
        <select id="chapterSelect" aria-label="장"></select>
      </div>
    </div>

    <div class="toolbar">
      <button id="prevChapter" class="icon-button" title="이전 장 (←)">←</button>
      <button id="nextChapter" class="icon-button" title="다음 장 (→)">→</button>
      <button id="fontDown" class="text-button" title="글자 작게">가−</button>
      <button id="fontUp" class="text-button" title="글자 크게">가+</button>
      <button id="widthToggle" class="text-button" title="본문 폭 변경">폭</button>
      <button id="themeToggle" class="icon-button" title="밝기 전환">◐</button>
    </div>
  </header>

  <main>
    <section class="reader-shell">
      <form id="searchForm" class="search-box" role="search">
        <input id="searchInput" type="search" autocomplete="off" placeholder="성경 전체에서 단어나 문장 검색" aria-label="성경 전체 검색" />
        <button id="searchButton" type="submit">검색</button>
      </form>
      <section id="searchPanel" class="search-panel" hidden aria-label="검색 결과">
        <div class="search-panel-head">
          <p id="searchSummary" class="search-summary"></p>
          <button id="closeSearch" type="button" class="search-close">닫기</button>
        </div>
        <div id="searchResults" class="search-results"></div>
      </section>

      <div class="chapter-heading">
        <p class="translation-label">개역한글 1961</p>
        <h1 id="chapterTitle">요한복음 3장</h1>
      </div>

      <div id="status" class="status">본문을 불러오는 중…</div>
      <article id="verses" class="verses" aria-live="polite"></article>

      <nav class="chapter-nav" aria-label="장 이동">
        <button id="prevChapterBottom">← 이전 장</button>
        <button id="nextChapterBottom">다음 장 →</button>
      </nav>
    </section>
  </main>

  <footer>
    <p>성경전서 개역한글판 · 대한성서공회</p>
    <p class="source-note">1차 MVP는 공개 검증용 데이터 소스를 사용하며, 공개 서비스 전 본문 무결성을 다시 검수합니다.</p>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
