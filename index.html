<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>성경 읽기</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="features.css" />
  <link rel="stylesheet" href="ui-fix.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner centered-nav">
      <div class="location-controls" aria-label="성경 위치 선택">
        <select id="translationSelect" class="translation-select" aria-label="성경 버전"><option value="krv1961">개역한글</option><option value="kjv">KJV · English</option><option value="web">WEB · English</option><option value="asv">ASV · English</option><option value="lsg">Louis Segond 1910 · Français</option><option value="luth1912">Lutherbibel 1912 · Deutsch</option><option value="cuv">和合本 CUV · 中文</option><option value="synodal">Синодальный · Русский</option><option value="vulg">Vulgata · Latina</option></select>
        <select id="testamentSelect" class="testament-select" aria-label="성경 범위"><option value="all">전체</option><option value="old">구약</option><option value="new">신약</option></select>
        <select id="bookSelect" aria-label="성경책"></select>
        <select id="chapterSelect" aria-label="장"></select>
        <select id="verseSelect" aria-label="절"><option value="1">1절</option></select>
        <form id="searchForm" class="top-search" role="search"><input id="searchInput" list="bookList" type="search" autocomplete="off" placeholder="책 이름 · 단어 · 요 3:16" aria-label="책 찾기, 성경 검색 또는 구절 바로가기" /><datalist id="bookList"></datalist><button id="searchButton" type="submit">검색</button></form>
      </div>
      <div class="toolbar" aria-label="읽기 도구"><button id="compareToggle" class="text-button primary-tool" type="button" aria-pressed="false">비교</button><span class="toolbar-divider"></span><button id="fontDown" class="quick-tool">가−</button><button id="fontUp" class="quick-tool">가+</button><button id="widthToggle" class="quick-tool">폭</button><button id="themeToggle" class="quick-tool">◐</button></div>
    </div>
  </header>
  <main><section class="reader-shell">
    <section class="daily-strip" aria-label="오늘의 말씀">
      <button id="dailyVerseCard" class="daily-card" type="button"><div class="daily-line"><span class="daily-kicker">오늘의 성구</span><strong id="dailyVerseRef">말씀을 준비하는 중…</strong><span class="daily-action">열기 →</span></div><span id="dailyVerseText" class="daily-text"></span></button>
      <button id="dailyChapterCard" class="daily-card" type="button"><div class="daily-line"><span class="daily-kicker">오늘의 묵상장</span><strong id="dailyChapterRef">묵상할 장을 준비하는 중…</strong><span class="daily-action">열기 →</span></div><span id="dailyChapterText" class="daily-text">오늘 한 장을 천천히 읽고 묵상해 보세요.</span></button>
    </section>
    <aside class="ad-slot ad-slot-top" data-ad-slot="top" aria-label="광고 영역"><span>광고</span></aside>
    <section id="searchPanel" class="search-panel" hidden><div class="search-panel-head"><p id="searchSummary" class="search-summary"></p><button id="closeSearch" type="button" class="search-close">닫기</button></div><div id="searchResults" class="search-results"></div></section>
    <div class="chapter-heading"><button id="prevChapterTitle" class="title-chapter-nav" type="button">← 이전 장</button><h1 id="chapterTitle">요한복음 3장</h1><button id="nextChapterTitle" class="title-chapter-nav" type="button">다음 장 →</button></div>

    <div class="reader-view-controls" aria-label="보기 방식"><div class="reader-view-buttons"><button id="singlePageView" type="button" class="reader-view-button active" aria-pressed="true">한 면 보기</button><button id="dualPageView" type="button" class="reader-view-button" aria-pressed="false">양면 보기</button></div></div>

    <section id="comparePanel" class="compare-panel" hidden aria-label="역본 비교">
      <div class="compare-head compare-head-selects">
        <div class="compare-translation-block"><select id="leftTranslation" aria-label="왼쪽 비교 역본"></select></div>
        <button id="swapTranslations" type="button" class="swap-button" title="좌우 역본 바꾸기">⇄</button>
        <div class="compare-translation-block"><select id="rightTranslation" aria-label="오른쪽 비교 역본"></select></div>
      </div>
      <div id="compareStatus" class="compare-status"></div><div id="compareRows" class="compare-rows"></div>
    </section>

    <div id="singleReader"><div id="status" class="status">본문을 불러오는 중…</div><article id="verses" class="verses"></article></div>
    <nav class="chapter-nav"><button id="prevChapterBottom">← 이전 장</button><button id="nextChapterBottom">다음 장 →</button></nav>
    <aside class="ad-slot ad-slot-bottom" data-ad-slot="bottom"><span>광고</span></aside>
  </section></main>
  <footer><p id="translationAttribution">개역한글 · 대한성서공회</p><p class="source-note">외국어 역본은 공개 도메인 또는 자유 재배포가 확인된 데이터만 제공합니다.</p></footer>
  <script src="app.js" defer></script><script src="reference.js" defer></script><script src="book-finder.js" defer></script><script src="testament-select.js" defer></script><script src="daily.js" defer></script><script src="annotations-data.js" defer></script><script src="annotations.js" defer></script><script src="compare.js" defer></script><script src="verse-picker.js" defer></script><script src="clipboard.js" defer></script><script src="title-nav.js" defer></script>
</body></html>
